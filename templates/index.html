<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UK Eye Care Unit Directory</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:       #0b7285;
      --teal-light: #1098ad;
      --teal-pale:  #e3fafc;
      --text:       #1a1a2e;
      --muted:      #5c6574;
      --border:     #dde3ea;
      --white:      #ffffff;
      --shadow:     0 2px 12px rgba(0,0,0,.08);
      --radius:     12px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f4f7fb;
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-light) 100%);
      color: #fff;
      padding: 0 24px;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 0 28px;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .logo-text h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -.3px; }
    .logo-text p  { font-size: .82rem; opacity: .85; margin-top: 1px; }

    /* Search bar */
    .search-wrap {
      display: flex;
      gap: 10px;
      max-width: 520px;
    }

    #postcode-input {
      flex: 1;
      padding: 13px 18px;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      outline: none;
      box-shadow: var(--shadow);
      text-transform: uppercase;
    }
    #postcode-input::placeholder { text-transform: none; color: #aab; }

    #search-btn {
      padding: 13px 26px;
      background: #fff;
      color: var(--teal);
      border: none;
      border-radius: var(--radius);
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: background .15s, color .15s, transform .1s;
      white-space: nowrap;
    }
    #search-btn:hover  { background: var(--teal-pale); }
    #search-btn:active { transform: scale(.97); }

    .error-msg {
      margin-top: 10px;
      font-size: .87rem;
      color: #ffe3e3;
      min-height: 20px;
    }

    /* ── Main layout ─────────────────────────────────────── */
    main {
      max-width: 1200px;
      margin: 28px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 380px 1fr;
      grid-template-rows: auto 1fr;
      gap: 20px;
      align-items: start;
    }

    /* status bar spans full width */
    #status-bar {
      grid-column: 1 / -1;
      font-size: .9rem;
      color: var(--muted);
      min-height: 22px;
    }
    #status-bar strong { color: var(--teal); }

    /* ── Results list ────────────────────────────────────── */
    #results-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: calc(100vh - 260px);
      overflow-y: auto;
      padding-right: 4px;
    }

    #results-list::-webkit-scrollbar { width: 5px; }
    #results-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow);
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color .15s, transform .1s;
      position: relative;
    }
    .card:hover         { border-color: var(--teal-light); transform: translateY(-1px); }
    .card.active        { border-color: var(--teal); }

    .card-rank {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 26px;
      height: 26px;
      background: var(--teal-pale);
      color: var(--teal);
      border-radius: 50%;
      font-size: .75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      padding-right: 36px;
      line-height: 1.3;
    }

    .card-type {
      display: inline-block;
      margin: 5px 0 8px;
      padding: 2px 9px;
      background: var(--teal-pale);
      color: var(--teal);
      border-radius: 20px;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .3px;
      text-transform: uppercase;
    }

    .card-meta {
      font-size: .84rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-meta span { display: flex; align-items: flex-start; gap: 6px; }
    .card-meta .icon { flex-shrink: 0; margin-top: 1px; }

    .card-distance {
      margin-top: 10px;
      font-size: .9rem;
      font-weight: 700;
      color: var(--teal);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .card-services {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .service-tag {
      padding: 2px 8px;
      background: #f0f4ff;
      color: #3b5bdb;
      border-radius: 20px;
      font-size: .7rem;
      font-weight: 500;
    }

    .card-links {
      margin-top: 10px;
      display: flex;
      gap: 12px;
    }

    .card-links a {
      font-size: .8rem;
      color: var(--teal);
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-links a:hover { text-decoration: underline; }

    /* placeholder when no search yet */
    .placeholder-state {
      background: var(--white);
      border-radius: var(--radius);
      padding: 32px 24px;
      box-shadow: var(--shadow);
      text-align: center;
      color: var(--muted);
    }
    .placeholder-state .big-icon { font-size: 3rem; margin-bottom: 12px; }
    .placeholder-state p { font-size: .9rem; line-height: 1.6; }

    /* ── Map ─────────────────────────────────────────────── */
    #map {
      height: calc(100vh - 260px);
      min-height: 420px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      z-index: 0;
      position: sticky;
      top: 20px;
    }

    /* Leaflet popup tweaks */
    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,.15);
    }
    .popup-name  { font-weight: 700; font-size: .95rem; margin-bottom: 3px; }
    .popup-addr  { font-size: .82rem; color: var(--muted); margin-bottom: 4px; }
    .popup-dist  { font-size: .82rem; font-weight: 700; color: var(--teal); }

    /* loading spinner */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr;
      }
      #map {
        height: 340px;
        min-height: 0;
        position: static;
        order: -1;
      }
      #results-list {
        max-height: none;
      }
    }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────── -->
<header>
  <div class="header-inner">
    <div class="header-logo">
      <div class="logo-icon">👁️</div>
      <div class="logo-text">
        <h1>UK Eye Care Directory</h1>
        <p>Find NHS eye care units near you</p>
      </div>
    </div>

    <div class="search-wrap">
      <input
        id="postcode-input"
        type="text"
        placeholder="Enter your postcode, e.g. SW1A 1AA"
        maxlength="8"
        autocomplete="postal-code"
      />
      <button id="search-btn" onclick="doSearch()">Find Units</button>
    </div>
    <p class="error-msg" id="error-msg"></p>
  </div>
</header>

<!-- ── Main ────────────────────────────────────────────────────── -->
<main>
  <p id="status-bar"></p>

  <!-- Left: results list -->
  <div id="results-list">
    <div class="placeholder-state">
      <div class="big-icon">🔍</div>
      <p>Enter your postcode above to find the nearest eye care units across the UK, sorted by distance.</p>
    </div>
  </div>

  <!-- Right: map -->
  <div id="map"></div>
</main>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  /* ── Map setup ─────────────────────────────────────────── */
  const map = L.map("map", { zoomControl: true }).setView([54.5, -3.5], 6);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 18,
  }).addTo(map);

  /* Custom marker icons */
  function makeIcon(color) {
    return L.divIcon({
      className: "",
      html: `<svg width="28" height="38" viewBox="0 0 28 38" xmlns="http://www.w3.org/2000/svg">
               <path d="M14 0C6.27 0 0 6.27 0 14c0 9.33 14 24 14 24S28 23.33 28 14C28 6.27 21.73 0 14 0z" fill="${color}" stroke="#fff" stroke-width="1.5"/>
               <circle cx="14" cy="14" r="6" fill="#fff"/>
             </svg>`,
      iconSize: [28, 38],
      iconAnchor: [14, 38],
      popupAnchor: [0, -38],
    });
  }

  const unitIcon   = makeIcon("#0b7285");
  const searchIcon = makeIcon("#e03131");

  let unitMarkers  = [];
  let searchMarker = null;

  /* ── Helpers ───────────────────────────────────────────── */
  function clearMarkers() {
    unitMarkers.forEach(m => map.removeLayer(m));
    unitMarkers = [];
    if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }
  }

  function setLoading(on) {
    const btn = document.getElementById("search-btn");
    if (on) {
      btn.innerHTML = '<span class="spinner"></span>Searching…';
      btn.disabled = true;
    } else {
      btn.innerHTML = "Find Units";
      btn.disabled = false;
    }
  }

  function setError(msg) {
    document.getElementById("error-msg").textContent = msg;
  }

  /* ── Build a result card ───────────────────────────────── */
  function buildCard(unit, rank) {
    const hasDistance = unit.distance_miles !== undefined;
    const services = unit.services.slice(0, 4).map(
      s => `<span class="service-tag">${s}</span>`
    ).join("");

    return `
      <div class="card" id="card-${unit.id}" onclick="focusUnit(${unit.id})">
        <div class="card-rank">${rank}</div>
        <div class="card-name">${unit.name}</div>
        <span class="card-type">${unit.type}</span>
        <div class="card-meta">
          <span><span class="icon">📍</span>${unit.address}, ${unit.city}, ${unit.postcode}</span>
          <span><span class="icon">📞</span>${unit.phone}</span>
          <span><span class="icon">🕐</span>${unit.opening_hours}</span>
        </div>
        ${hasDistance ? `<div class="card-distance">📏 ${unit.distance_miles} miles away</div>` : ""}
        <div class="card-services">${services}</div>
        <div class="card-links">
          <a href="https://maps.google.com/?q=${encodeURIComponent(unit.address + ', ' + unit.city)}" target="_blank" rel="noopener">🗺 Directions</a>
          <a href="${unit.website}" target="_blank" rel="noopener">🌐 Website</a>
        </div>
      </div>`;
  }

  /* ── Place markers on map ──────────────────────────────── */
  function placeMarkers(units, searchLat, searchLng, searchPostcode) {
    clearMarkers();

    if (searchLat) {
      searchMarker = L.marker([searchLat, searchLng], { icon: makeIcon("#e03131") })
        .addTo(map)
        .bindPopup(`<div class="popup-name">Your location</div><div class="popup-addr">${searchPostcode}</div>`);
    }

    units.forEach((unit, i) => {
      const m = L.marker([unit.lat, unit.lng], { icon: unitIcon })
        .addTo(map)
        .bindPopup(`
          <div class="popup-name">${unit.name}</div>
          <div class="popup-addr">${unit.city}, ${unit.postcode}</div>
          ${unit.distance_miles !== undefined ? `<div class="popup-dist">📏 ${unit.distance_miles} miles</div>` : ""}
        `);

      m.on("click", () => highlightCard(unit.id));
      unitMarkers.push(m);
      unit._marker = m;
    });

    /* Fit map to all markers */
    const allLatLngs = units.map(u => [u.lat, u.lng]);
    if (searchLat) allLatLngs.push([searchLat, searchLng]);
    if (allLatLngs.length) map.fitBounds(L.latLngBounds(allLatLngs), { padding: [40, 40] });
  }

  /* ── Highlight logic ───────────────────────────────────── */
  let allUnits = [];

  function highlightCard(id) {
    document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
    const card = document.getElementById(`card-${id}`);
    if (card) {
      card.classList.add("active");
      card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }

  function focusUnit(id) {
    const unit = allUnits.find(u => u.id === id);
    if (!unit || !unit._marker) return;
    highlightCard(id);
    map.setView([unit.lat, unit.lng], 14, { animate: true });
    unit._marker.openPopup();
  }

  /* ── Main search ───────────────────────────────────────── */
  async function doSearch() {
    const raw = document.getElementById("postcode-input").value.trim();
    if (!raw) { setError("Please enter a postcode."); return; }
    setError("");
    setLoading(true);

    try {
      const res  = await fetch(`/api/search?postcode=${encodeURIComponent(raw)}`);
      const data = await res.json();

      if (!res.ok) {
        setError(data.error || "Something went wrong.");
        setLoading(false);
        return;
      }

      allUnits = data.units;

      /* Render cards */
      const list = document.getElementById("results-list");
      list.innerHTML = allUnits.map((u, i) => buildCard(u, i + 1)).join("");

      /* Status bar */
      document.getElementById("status-bar").innerHTML =
        `Showing <strong>${allUnits.length} eye care units</strong> nearest to <strong>${data.postcode}</strong>`;

      /* Map */
      placeMarkers(allUnits, data.search_lat, data.search_lng, data.postcode);

    } catch (err) {
      setError("Network error. Please try again.");
    }

    setLoading(false);
  }

  /* Allow Enter key to trigger search */
  document.getElementById("postcode-input").addEventListener("keydown", e => {
    if (e.key === "Enter") doSearch();
  });

  /* Load all units on page load (no distances) so map isn't empty */
  (async () => {
    try {
      const res  = await fetch("/api/units");
      const data = await res.json();
      allUnits = data;
      placeMarkers(data, null, null, null);
    } catch (_) {}
  })();
</script>

</body>
</html>
